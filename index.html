<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Checklist Simples</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafafa;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            transition: background 0.2s;
        }

        li.completed span {
            text-decoration: line-through;
            color: #888;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
        }

        .delete-btn:hover {
            background-color: #fde8e8;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Meu Checklist</h1>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Adicionar nova tarefa..." onkeypress="handleKeyPress(event)">
            <button onclick="addTask()">Adicionar</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();

            if (taskText === "") {
                alert("Digite uma tarefa válida!");
                return;
            }

            const taskList = document.getElementById('taskList');

            const li = document.createElement('li');

            const taskInfo = document.createElement('div');
            taskInfo.className = 'task-info';
            taskInfo.onclick = () => toggleTask(li);

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.onchange = () => toggleTask(li);

            const span = document.createElement('span');
            span.textContent = taskText;

            taskInfo.appendChild(checkbox);
            taskInfo.appendChild(span);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = 'Remover';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                li.remove();
            };

            li.appendChild(taskInfo);
            li.appendChild(deleteBtn);
            taskList.appendChild(li);

            input.value = "";
            input.focus();
        }

        function toggleTask(li) {
            const checkbox = li.querySelector('input[type="checkbox"]');
            checkbox.checked = !checkbox.checked;
            li.classList.toggle('completed', checkbox.checked);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        }
    </script>

</body>
</html>
